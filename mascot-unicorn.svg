<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" role="img" aria-label="Unicorn striking the ground, N coins scattering from the hoof">
  <defs>
    <radialGradient id="aura" cx="52%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#ff37c7" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#7850ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff37c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hide" x1="0.25" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#544064"/>
      <stop offset="42%" stop-color="#352747"/>
      <stop offset="100%" stop-color="#1c1428"/>
    </linearGradient>
    <linearGradient id="hideLit" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#5e4870"/>
      <stop offset="55%" stop-color="#3a2b4d"/>
      <stop offset="100%" stop-color="#241a31"/>
    </linearGradient>
    <linearGradient id="limbG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#463358"/>
      <stop offset="100%" stop-color="#221930"/>
    </linearGradient>
    <linearGradient id="mane1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffd9f4"/><stop offset="100%" stop-color="#ff6ad9"/>
    </linearGradient>
    <linearGradient id="mane2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ff5ad2"/><stop offset="100%" stop-color="#ff37c7"/>
    </linearGradient>
    <linearGradient id="mane3" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#e04ae8"/><stop offset="100%" stop-color="#a24bff"/>
    </linearGradient>
    <linearGradient id="mane4" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c94bff"/><stop offset="100%" stop-color="#7a3fd6"/>
    </linearGradient>
    <linearGradient id="hornG" x1="0" y1="1" x2="0.7" y2="0">
      <stop offset="0%" stop-color="#ff6ad9"/>
      <stop offset="55%" stop-color="#ffd9f4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#4a3552"/>
      <stop offset="68%" stop-color="#271d31"/>
      <stop offset="100%" stop-color="#181022"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="tiny" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>

  <style>
    @keyframes blink{0%,95%,100%{transform:scaleY(1)}97.5%{transform:scaleY(.08)}}
    #eye{transform-box:fill-box;transform-origin:center;animation:blink 6.5s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){#eye{animation:none}}
  </style>

  <ellipse cx="300" cy="230" rx="225" ry="190" fill="url(#aura)"/>
  <ellipse cx="290" cy="400" rx="155" ry="13" fill="#ff37c7" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="290" cy="400" rx="74" ry="6" fill="#fc72ff" opacity="0.14" filter="url(#tiny)"/>

  <!-- ================= tail: separate strands ================= -->
  <g>
    <path d="M198 234 C 168 240, 138 268, 122 306 C 110 336, 112 364, 126 380
             C 126 352, 136 322, 154 296 C 168 276, 186 258, 200 250 Z" fill="url(#mane4)"/>
    <path d="M200 240 C 174 250, 148 276, 134 310 C 124 334, 124 356, 134 370
             C 134 344, 144 318, 160 296 C 174 278, 190 264, 202 256 Z" fill="url(#mane3)"/>
    <path d="M202 246 C 182 258, 162 282, 150 310 C 142 330, 142 348, 150 360
             C 150 338, 158 316, 170 298 C 182 282, 194 270, 204 262 Z" fill="url(#mane2)"/>
    <path d="M196 252 C 176 268, 160 292, 152 314" stroke="#ffd9f4" stroke-width="2" fill="none" opacity="0.4"/>
  </g>

  <!-- ================= far legs, held back so the near pair reads first ============ -->
  <g opacity="0.72">
    <path d="M246 274 L238 324" stroke="#241a31" stroke-width="23" stroke-linecap="round"/>
    <path d="M238 324 L234 378" stroke="#241a31" stroke-width="12" stroke-linecap="round"/>
    <path d="M223 372 h22 l2 13 q0 5 -5 5 h-16 q-5 0 -5 -5 z" fill="#181022"/>
    <path d="M352 272 L346 322" stroke="#241a31" stroke-width="22" stroke-linecap="round"/>
    <path d="M346 322 L342 378" stroke="#241a31" stroke-width="11" stroke-linecap="round"/>
    <path d="M331 372 h22 l2 13 q0 5 -5 5 h-16 q-5 0 -5 -5 z" fill="#181022"/>
  </g>

  <!-- ================= near hind leg: thick above the joint, thin below ========= -->
  <path d="M216 268 L206 322" stroke="url(#limbG)" stroke-width="27" stroke-linecap="round"/>
  <path d="M206 322 L200 378" stroke="url(#limbG)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="206" cy="322" r="8.5" fill="#4a3758"/>
  <path d="M188 371 h24 l2 14 q0 6 -6 6 h-16 q-6 0 -6 -6 z" fill="#1a1224" stroke="#7a5b8a" stroke-width="1.3"/>

  <!-- ================= body ================= -->
  <path d="M198 250
           C 190 220, 208 198, 236 193
           C 268 187, 302 194, 328 205
           C 348 213, 363 226, 372 242
           C 382 258, 383 277, 375 290
           C 366 303, 346 309, 322 307
           C 298 305, 268 309, 244 308
           C 218 307, 200 296, 193 278
           C 188 267, 191 258, 198 250 Z"
        fill="url(#hide)"/>
  <!-- haunch and shoulder: the two masses that make a horse read as a horse -->
  <ellipse cx="230" cy="248" rx="44" ry="49" fill="#3f2f52" opacity="0.55"/>
  <ellipse cx="349" cy="252" rx="26" ry="38" fill="#4a3760" opacity="0.5"/>
  <!-- rim light along the topline -->
  <path d="M206 226 C 224 202, 262 193, 300 198 C 330 202, 352 214, 368 234"
        stroke="#9b7fae" stroke-width="2.6" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- belly shadow -->
  <path d="M214 296 C 250 310, 306 311, 358 298" stroke="#150f1f" stroke-width="9" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M264 300 C 268 288, 268 274, 262 262" stroke="#2a1f3a" stroke-width="2" fill="none" opacity="0.45"/>

  <!-- ================= neck ================= -->
  <path d="M330 216
           C 342 190, 362 164, 390 145
           C 406 134, 422 127, 436 125
           L 448 165
           C 432 171, 412 184, 397 201
           C 383 217, 373 234, 367 247
           C 355 234, 343 224, 330 216 Z"
        fill="url(#hideLit)"/>
  <path d="M344 210 C 358 186, 380 162, 406 146" stroke="#9b7fae" stroke-width="2.2" fill="none" opacity="0.4"/>

  <!-- ================= head ================= -->
  <path d="M432 120
           C 456 118, 477 129, 489 148
           C 498 162, 499 177, 489 185
           C 478 195, 456 198, 437 193
           C 422 189, 412 178, 410 163
           C 408 145, 418 125, 432 120 Z"
        fill="url(#hideLit)"/>
  <path d="M424 156 C 432 174, 449 186, 470 189" stroke="#2a1f3a" stroke-width="2.2" fill="none" opacity="0.55"/>
  <!-- muzzle, a shade darker -->
  <path d="M466 172 C 480 170, 492 174, 492 182 C 492 190, 478 196, 464 194
           C 456 192, 452 186, 454 180 C 456 175, 460 173, 466 172 Z" fill="#2b2039"/>
  <circle cx="479" cy="180" r="3.4" fill="#120c19"/>
  <path d="M462 190 C 470 193, 480 192, 486 188" stroke="#120c19" stroke-width="1.7" fill="none" opacity="0.75"/>
  <!-- ears -->
  <path d="M424 122 L416 96 L437 114 Z" fill="#4a3760"/>
  <path d="M423 118 L418 102 L431 113 Z" fill="#241a31"/>
  <path d="M442 118 L442 96 L456 116 Z" fill="#3a2b4d" opacity="0.85"/>
  <!-- brow + eye -->
  <path d="M428 140 C 436 136, 446 137, 452 142" stroke="#241a31" stroke-width="2.4" fill="none" opacity="0.8" stroke-linecap="round"/>
  <g id="eye">
    <ellipse cx="440" cy="152" rx="7.5" ry="8.5" fill="#100a17"/>
    <circle cx="443" cy="148.5" r="2.6" fill="#ffe4f7"/>
    <circle cx="437" cy="156" r="1.3" fill="#ff9ae8" opacity="0.8"/>
  </g>

  <!-- ================= horn ================= -->
  <path d="M438 116 L452 111 L481 46 Z" fill="url(#hornG)"/>
  <g stroke="#3a2b4d" stroke-width="1.6" opacity="0.45" stroke-linecap="round">
    <path d="M442 106 L455 101"/><path d="M447 90 L459 86"/>
    <path d="M452 74 L463 71"/><path d="M457 60 L466 58"/>
  </g>
  <circle cx="481" cy="46" r="10" fill="#fc72ff" opacity="0.45" filter="url(#tiny)"/>
  <circle cx="481" cy="46" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- ================= mane: four overlapping strands ================= -->
  <g>
    <path d="M436 122 C 416 120, 394 134, 376 156 C 356 180, 340 212, 330 244
             C 342 234, 352 226, 362 220 C 352 244, 344 268, 340 288
             C 356 264, 372 240, 386 224 C 380 244, 376 260, 374 274
             C 390 246, 408 214, 420 186 C 431 162, 438 140, 436 122 Z" fill="url(#mane4)"/>
    <path d="M434 124 C 416 124, 397 138, 381 159 C 363 182, 349 210, 341 238
             C 351 229, 360 222, 368 217 C 360 238, 353 258, 350 275
             C 364 253, 378 232, 390 219 C 386 236, 383 250, 381 262
             C 394 238, 409 210, 419 186 C 429 163, 435 141, 434 124 Z" fill="url(#mane3)"/>
    <path d="M432 126 C 416 128, 400 142, 386 162 C 370 184, 358 208, 351 233
             C 360 225, 368 219, 375 215 C 368 233, 362 250, 359 265
             C 371 246, 383 228, 393 217 C 390 232, 388 244, 387 254
             C 398 232, 411 208, 419 187 C 427 166, 432 145, 432 126 Z" fill="url(#mane2)"/>
    <path d="M430 128 C 417 132, 404 146, 392 165 C 379 185, 369 206, 363 228
             C 370 221, 377 216, 383 213 C 377 229, 372 244, 370 257
             C 380 240, 390 225, 398 216 C 396 229, 394 239, 393 247
             C 402 228, 413 207, 420 188 C 427 169, 431 148, 430 128 Z" fill="url(#mane1)" opacity="0.92"/>
    <path d="M424 140 C 410 156, 396 180, 386 206" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.45"/>
  </g>

  <!-- ================= near front leg, planted ================= -->
  <path d="M340 272 L332 322" stroke="url(#limbG)" stroke-width="25" stroke-linecap="round"/>
  <path d="M332 322 L328 378" stroke="url(#limbG)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="332" cy="322" r="8" fill="#4a3758"/>
  <path d="M316 371 h24 l2 14 q0 6 -6 6 h-16 q-6 0 -6 -6 z" fill="#1a1224" stroke="#7a5b8a" stroke-width="1.3"/>

  <!-- ================= striking leg — the page drives this ================= -->
  <g id="nk-leg">
    <path class="nk-leg-up" d="M352 268 L372 322" stroke="url(#limbG)" stroke-width="26" stroke-linecap="round"/>
    <path class="nk-leg-lo" d="M372 322 L390 378" stroke="url(#limbG)" stroke-width="14" stroke-linecap="round"/>
    <circle class="nk-leg-knee" cx="372" cy="322" r="8.5" fill="#5a4568"/>
    <g id="nk-hoof" transform="translate(390 378)">
      <path d="M-13 -7 h26 l2 14 q0 6 -6 6 h-18 q-6 0 -6 -6 z" fill="#1a1224" stroke="#b07ac0" stroke-width="1.5"/>
      <path d="M-13 -7 h26 l1 5 h-28 z" fill="#fc72ff" opacity="0.5"/>
    </g>
  </g>

  <!-- impact flash under the hoof -->
  <g id="nk-impact" opacity="0">
    <ellipse cx="391" cy="394" rx="40" ry="9" fill="#fc72ff" opacity="0.55" filter="url(#tiny)"/>
    <g stroke="#ffe4f7" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
      <path d="M360 388 L344 378"/><path d="M422 388 L438 378"/>
      <path d="M391 380 L391 364"/><path d="M372 384 L362 370"/><path d="M410 384 L420 370"/>
    </g>
  </g>

  <!-- ================= coins thrown up by the strike ================= -->
  <g id="nk-coins">
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="20" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="13" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="19" fill="#ffe4f7">N</text></g>
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="17" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="11" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="16" fill="#ffe4f7">N</text></g>
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="21" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="14" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="20" fill="#ffe4f7">N</text></g>
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="16" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="10" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="15" fill="#ffe4f7">N</text></g>
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="18" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="12" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="17" fill="#ffe4f7">N</text></g>
    <g class="nk-coin" transform="translate(391 386) scale(0)" opacity="0"><circle r="15" fill="url(#coinFace)" stroke="#ff37c7" stroke-width="2.2"/><circle r="9" fill="none" stroke="#fc72ff" stroke-width="1.1" opacity="0.55"/><text dy="0.36em" text-anchor="middle" font-family="var(--font-geist-sans),system-ui,sans-serif" font-weight="600" font-size="14" fill="#ffe4f7">N</text></g>
  </g>
</svg>
