<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" fill="none" role="img" aria-label="Floating high-tech AI robot holding a Nock coin">
  <defs>
    <radialGradient id="aura" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#23c76f" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#149657" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#23c76f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c6349"/>
      <stop offset="34%" stop-color="#152e21"/>
      <stop offset="100%" stop-color="#081409"/>
    </linearGradient>
    <linearGradient id="metalHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#356b4f"/>
      <stop offset="55%" stop-color="#163224"/>
      <stop offset="100%" stop-color="#0b1c12"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06130c"/>
      <stop offset="100%" stop-color="#040a06"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1e5a3c"/>
      <stop offset="58%" stop-color="#0d2418"/>
      <stop offset="100%" stop-color="#06140d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e9fdf1"/>
      <stop offset="38%" stop-color="#5fe6a0"/>
      <stop offset="100%" stop-color="#23c76f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurG" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <style>
    /* one small human touch: an occasional blink. Nothing else moves. */
    @keyframes nkBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
    #eyes{transform-box:fill-box;transform-origin:center;animation:nkBlink 6.5s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){#eyes{animation:none}}
  </style>

  <!-- ambient aura + floating particles -->
  <ellipse cx="230" cy="250" rx="205" ry="240" fill="url(#aura)"/>
  <g fill="#86d8a8">
    <circle class="pt" cx="104" cy="150" r="3" opacity="0.8"/>
    <circle class="pt" cx="356" cy="118" r="2.4" opacity="0.7"/>
    <circle class="pt" cx="92" cy="352" r="2.2" opacity="0.6"/>
    <circle class="pt" cx="372" cy="330" r="3.2" opacity="0.75"/>
    <circle class="pt" cx="150" cy="86" r="2" opacity="0.6"/>
    <circle class="pt" cx="316" cy="470" r="2.4" opacity="0.6"/>
    <circle class="pt" cx="120" cy="486" r="2" opacity="0.55"/>
  </g>
  <g id="hexes" stroke="#23c76f" stroke-width="1.4" opacity="0.35" fill="none">
    <path d="M78 250 l14 -8 l14 8 l0 16 l-14 8 l-14 -8 Z"/>
    <path d="M368 210 l12 -7 l12 7 l0 14 l-12 7 l-12 -7 Z"/>
  </g>

  <!-- floor glow (floating) -->
  <ellipse id="floor1" cx="230" cy="540" rx="132" ry="20" fill="#23c76f" opacity="0.16" filter="url(#blurG)"/>
  <ellipse id="floor2" cx="230" cy="540" rx="72" ry="10" fill="#86d8a8" opacity="0.35" filter="url(#blurS)"/>

  <!-- lower hover body + thruster (behind coin) -->
  <path d="M188 348 L200 442 Q230 476 260 442 L272 348 Z" fill="url(#metal)" stroke="#275c42" stroke-width="1.5"/>
  <ellipse cx="230" cy="470" rx="30" ry="12" fill="#5fe6a0" opacity="0.55" filter="url(#blurG)"/>
  <ellipse cx="230" cy="466" rx="14" ry="6" fill="#e9fdf1" opacity="0.7" filter="url(#blurS)"/>

  <!-- arms (behind coin) -->
  <path d="M162 250 C 130 302, 150 360, 196 396" stroke="url(#metal)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M298 250 C 330 302, 310 360, 264 396" stroke="url(#metal)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M164 254 C 138 300, 152 352, 190 388" stroke="#6fe3a4" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M296 254 C 322 300, 308 352, 270 388" stroke="#6fe3a4" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- torso -->
  <path d="M150 248 Q150 220 178 216 L282 216 Q310 220 310 248 L302 332 Q298 354 276 358 L184 358 Q162 354 158 332 Z" fill="url(#metal)" stroke="#2c6349" stroke-width="1.5"/>
  <path d="M158 320 Q152 272 174 226" stroke="#6fe3a4" stroke-width="2" fill="none" opacity="0.45"/>
  <!-- shoulders -->
  <circle cx="160" cy="246" r="24" fill="url(#metal)" stroke="#2c6349" stroke-width="1.5"/>
  <circle cx="300" cy="246" r="24" fill="url(#metal)" stroke="#2c6349" stroke-width="1.5"/>
  <circle cx="160" cy="246" r="7" fill="#23c76f" opacity="0.8"/>
  <circle cx="300" cy="246" r="7" fill="#23c76f" opacity="0.8"/>
  <!-- chest core -->
  <circle id="coreGlow" cx="230" cy="286" r="34" fill="url(#core)" filter="url(#blurS)"/>
  <circle cx="230" cy="286" r="26" fill="none" stroke="#2a6247" stroke-width="5"/>
  <circle cx="230" cy="286" r="16" fill="#0f2a1c"/>
  <circle id="coreDot" cx="230" cy="286" r="9" fill="#e9fdf1"/>
  <line x1="196" y1="332" x2="264" y2="332" stroke="#2a6247" stroke-width="3"/>
  <line x1="206" y1="342" x2="254" y2="342" stroke="#2a6247" stroke-width="2"/>

  <!-- neck -->
  <rect x="207" y="184" width="46" height="28" rx="10" fill="url(#metal)"/>

  <!-- antenna -->
  <line x1="230" y1="56" x2="230" y2="30" stroke="#39704f" stroke-width="4"/>
  <circle id="antTip" cx="230" cy="25" r="8" fill="#5fe6a0" filter="url(#blurS)"/>
  <circle cx="230" cy="25" r="4" fill="#e9fdf1"/>

  <!-- head -->
  <rect x="156" y="52" width="148" height="140" rx="38" fill="url(#metalHead)" stroke="#3a7357" stroke-width="1.5"/>
  <rect x="170" y="60" width="120" height="18" rx="9" fill="#ffffff" opacity="0.06"/>
  <path d="M170 76 Q160 102 160 140" stroke="#6fe3a4" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- ear units -->
  <rect x="145" y="108" width="12" height="42" rx="6" fill="url(#metal)"/>
  <rect x="303" y="108" width="12" height="42" rx="6" fill="url(#metal)"/>
  <circle cx="151" cy="129" r="3" fill="#5fe6a0"/>
  <circle cx="309" cy="129" r="3" fill="#5fe6a0"/>

  <!-- AI label on forehead -->
  <text x="231" y="105" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="1" fill="#23c76f" filter="url(#blurG)">AI</text>
  <text x="230" y="104" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="1" fill="#dcf7e8">AI</text>

  <!-- visor + eyes -->
  <rect x="175" y="116" width="110" height="52" rx="22" fill="url(#visor)" stroke="#1e4a35" stroke-width="1.5"/>
  <rect class="eyeGlow" x="196" y="134" width="30" height="12" rx="6" fill="#23c76f" filter="url(#blurG)"/>
  <rect class="eyeGlow" x="234" y="134" width="30" height="12" rx="6" fill="#23c76f" filter="url(#blurG)"/>
  <g id="eyes">
    <rect x="196" y="135" width="30" height="10" rx="5" fill="#c2f7db"/>
    <rect x="234" y="135" width="30" height="10" rx="5" fill="#c2f7db"/>
  </g>

  <!-- coin (in front of arms) -->
  <circle cx="230" cy="400" r="62" fill="#23c76f" opacity="0.5" filter="url(#blurG)"/>
  <circle cx="230" cy="400" r="58" fill="url(#coinFace)"/>
  <circle cx="230" cy="400" r="56" fill="none" stroke="#0f2a1c" stroke-width="8"/>
  <circle id="coinRidge" cx="230" cy="400" r="56" fill="none" stroke="#23c76f" stroke-width="8" stroke-dasharray="3 7" opacity="0.55"/>
  <circle cx="230" cy="400" r="47" fill="none" stroke="#20573c" stroke-width="2"/>
  <path d="M196 368 A58 58 0 0 1 264 368" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.14"/>
  <text x="231" y="401" dy="0.35em" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="62" fill="#23c76f" filter="url(#blurG)">N</text>
  <text x="230" y="400" dy="0.35em" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="62" fill="#e4f9ed">N</text>

  <!-- hands / grippers (in front of coin) -->
  <g fill="url(#metal)" stroke="#2c6349" stroke-width="1.5">
    <rect x="168" y="384" width="40" height="30" rx="13"/>
    <rect x="252" y="384" width="40" height="30" rx="13"/>
  </g>
  <g stroke="#07140c" stroke-width="2">
    <line x1="181" y1="386" x2="181" y2="412"/>
    <line x1="194" y1="386" x2="194" y2="412"/>
    <line x1="266" y1="386" x2="266" y2="412"/>
    <line x1="279" y1="386" x2="279" y2="412"/>
  </g>
  <circle cx="188" cy="382" r="3" fill="#5fe6a0"/>
  <circle cx="272" cy="382" r="3" fill="#5fe6a0"/>
</svg>
