<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 580" fill="none" role="img" aria-label="Floating high-tech AI robot holding a Nock coin">
  <defs>
    <radialGradient id="aura" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#3b6dff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#2447c9" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3b6dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b4c78"/>
      <stop offset="34%" stop-color="#1d2942"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="metalHead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43567f"/>
      <stop offset="55%" stop-color="#1f2b46"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#2b3c66"/>
      <stop offset="58%" stop-color="#141d35"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf1ff"/>
      <stop offset="38%" stop-color="#6f93ff"/>
      <stop offset="100%" stop-color="#3b6dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurG" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blurS" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <style>
    @keyframes nkPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
    @keyframes nkBreathe{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
    @keyframes nkBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
    @keyframes nkTwinkle{0%,100%{opacity:.35}50%{opacity:.95}}
    @keyframes nkDrift{0%{transform:translateY(0)}50%{transform:translateY(-8px)}100%{transform:translateY(0)}}
    @keyframes nkSpin{to{transform:rotate(360deg)}}
    @keyframes nkFloorPulse{0%,100%{opacity:.22;transform:scaleX(1)}50%{opacity:.4;transform:scaleX(1.12)}}
    #eyes{transform-box:fill-box;transform-origin:center;animation:nkBlink 5.2s ease-in-out infinite}
    .eyeGlow{transform-box:fill-box;transform-origin:center;animation:nkPulse 2.6s ease-in-out infinite}
    #coreGlow{transform-box:fill-box;transform-origin:center;animation:nkBreathe 3s ease-in-out infinite}
    #coreDot{transform-box:fill-box;transform-origin:center;animation:nkBreathe 3s ease-in-out infinite}
    #antTip{transform-box:fill-box;transform-origin:center;animation:nkPulse 2s ease-in-out infinite}
    .pt{animation:nkTwinkle 3.4s ease-in-out infinite}
    .pt:nth-of-type(2){animation-delay:.6s}.pt:nth-of-type(3){animation-delay:1.2s}
    .pt:nth-of-type(4){animation-delay:.3s}.pt:nth-of-type(5){animation-delay:1.6s}
    .pt:nth-of-type(6){animation-delay:.9s}.pt:nth-of-type(7){animation-delay:2s}
    #hexes{transform-box:fill-box;transform-origin:center;animation:nkDrift 7s ease-in-out infinite}
    #floor1,#floor2{transform-box:fill-box;transform-origin:center;animation:nkFloorPulse 4s ease-in-out infinite}
    #coinRidge{transform-box:fill-box;transform-origin:230px 400px;animation:nkSpin 28s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- ambient aura + floating particles -->
  <ellipse cx="230" cy="250" rx="205" ry="240" fill="url(#aura)"/>
  <g fill="#8fa8ff">
    <circle class="pt" cx="104" cy="150" r="3" opacity="0.8"/>
    <circle class="pt" cx="356" cy="118" r="2.4" opacity="0.7"/>
    <circle class="pt" cx="92" cy="352" r="2.2" opacity="0.6"/>
    <circle class="pt" cx="372" cy="330" r="3.2" opacity="0.75"/>
    <circle class="pt" cx="150" cy="86" r="2" opacity="0.6"/>
    <circle class="pt" cx="316" cy="470" r="2.4" opacity="0.6"/>
    <circle class="pt" cx="120" cy="486" r="2" opacity="0.55"/>
  </g>
  <g id="hexes" stroke="#3b6dff" stroke-width="1.4" opacity="0.35" fill="none">
    <path d="M78 250 l14 -8 l14 8 l0 16 l-14 8 l-14 -8 Z"/>
    <path d="M368 210 l12 -7 l12 7 l0 14 l-12 7 l-12 -7 Z"/>
  </g>

  <!-- floor glow (floating) -->
  <ellipse id="floor1" cx="230" cy="540" rx="132" ry="20" fill="#3b6dff" opacity="0.28" filter="url(#blurG)"/>
  <ellipse id="floor2" cx="230" cy="540" rx="72" ry="10" fill="#8fa8ff" opacity="0.35" filter="url(#blurS)"/>

  <!-- lower hover body + thruster (behind coin) -->
  <path d="M188 348 L200 442 Q230 476 260 442 L272 348 Z" fill="url(#metal)" stroke="#334670" stroke-width="1.5"/>
  <ellipse cx="230" cy="470" rx="30" ry="12" fill="#6f93ff" opacity="0.55" filter="url(#blurG)"/>
  <ellipse cx="230" cy="466" rx="14" ry="6" fill="#eaf1ff" opacity="0.7" filter="url(#blurS)"/>

  <!-- arms (behind coin) -->
  <path d="M162 250 C 130 302, 150 360, 196 396" stroke="url(#metal)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M298 250 C 330 302, 310 360, 264 396" stroke="url(#metal)" stroke-width="28" stroke-linecap="round" fill="none"/>
  <path d="M164 254 C 138 300, 152 352, 190 388" stroke="#7f9dff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M296 254 C 322 300, 308 352, 270 388" stroke="#7f9dff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- torso -->
  <path d="M150 248 Q150 220 178 216 L282 216 Q310 220 310 248 L302 332 Q298 354 276 358 L184 358 Q162 354 158 332 Z" fill="url(#metal)" stroke="#3b4c78" stroke-width="1.5"/>
  <path d="M158 320 Q152 272 174 226" stroke="#7f9dff" stroke-width="2" fill="none" opacity="0.45"/>
  <!-- shoulders -->
  <circle cx="160" cy="246" r="24" fill="url(#metal)" stroke="#3b4c78" stroke-width="1.5"/>
  <circle cx="300" cy="246" r="24" fill="url(#metal)" stroke="#3b4c78" stroke-width="1.5"/>
  <circle cx="160" cy="246" r="7" fill="#3b6dff" opacity="0.8"/>
  <circle cx="300" cy="246" r="7" fill="#3b6dff" opacity="0.8"/>
  <!-- chest core -->
  <circle id="coreGlow" cx="230" cy="286" r="34" fill="url(#core)" filter="url(#blurS)"/>
  <circle cx="230" cy="286" r="26" fill="none" stroke="#33477a" stroke-width="5"/>
  <circle cx="230" cy="286" r="16" fill="#1a2440"/>
  <circle id="coreDot" cx="230" cy="286" r="9" fill="#eaf1ff"/>
  <line x1="196" y1="332" x2="264" y2="332" stroke="#33477a" stroke-width="3"/>
  <line x1="206" y1="342" x2="254" y2="342" stroke="#33477a" stroke-width="2"/>

  <!-- neck -->
  <rect x="207" y="184" width="46" height="28" rx="10" fill="url(#metal)"/>

  <!-- antenna -->
  <line x1="230" y1="56" x2="230" y2="30" stroke="#4a5a8a" stroke-width="4"/>
  <circle id="antTip" cx="230" cy="25" r="8" fill="#6f93ff" filter="url(#blurS)"/>
  <circle cx="230" cy="25" r="4" fill="#eaf1ff"/>

  <!-- head -->
  <rect x="156" y="52" width="148" height="140" rx="38" fill="url(#metalHead)" stroke="#4b5f92" stroke-width="1.5"/>
  <rect x="170" y="60" width="120" height="18" rx="9" fill="#ffffff" opacity="0.06"/>
  <path d="M170 76 Q160 102 160 140" stroke="#7f9dff" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- ear units -->
  <rect x="145" y="108" width="12" height="42" rx="6" fill="url(#metal)"/>
  <rect x="303" y="108" width="12" height="42" rx="6" fill="url(#metal)"/>
  <circle cx="151" cy="129" r="3" fill="#6f93ff"/>
  <circle cx="309" cy="129" r="3" fill="#6f93ff"/>

  <!-- AI label on forehead -->
  <text x="231" y="105" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="1" fill="#3b6dff" filter="url(#blurG)">AI</text>
  <text x="230" y="104" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="1" fill="#dfe8ff">AI</text>

  <!-- visor + eyes -->
  <rect x="175" y="116" width="110" height="52" rx="22" fill="url(#visor)" stroke="#26365c" stroke-width="1.5"/>
  <rect class="eyeGlow" x="196" y="134" width="30" height="12" rx="6" fill="#3b6dff" filter="url(#blurG)"/>
  <rect class="eyeGlow" x="234" y="134" width="30" height="12" rx="6" fill="#3b6dff" filter="url(#blurG)"/>
  <g id="eyes">
    <rect x="196" y="135" width="30" height="10" rx="5" fill="#bcd6ff"/>
    <rect x="234" y="135" width="30" height="10" rx="5" fill="#bcd6ff"/>
  </g>

  <!-- coin (in front of arms) -->
  <circle cx="230" cy="400" r="62" fill="#3b6dff" opacity="0.5" filter="url(#blurG)"/>
  <circle cx="230" cy="400" r="58" fill="url(#coinFace)"/>
  <circle cx="230" cy="400" r="56" fill="none" stroke="#1a2440" stroke-width="8"/>
  <circle id="coinRidge" cx="230" cy="400" r="56" fill="none" stroke="#3b6dff" stroke-width="8" stroke-dasharray="3 7" opacity="0.55"/>
  <circle cx="230" cy="400" r="47" fill="none" stroke="#2c3d6b" stroke-width="2"/>
  <path d="M196 368 A58 58 0 0 1 264 368" stroke="#ffffff" stroke-width="6" fill="none" opacity="0.14"/>
  <text x="231" y="401" dy="0.35em" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="62" fill="#3b6dff" filter="url(#blurG)">N</text>
  <text x="230" y="400" dy="0.35em" text-anchor="middle" font-family="Geist, ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="62" fill="#e6eeff">N</text>

  <!-- hands / grippers (in front of coin) -->
  <g fill="url(#metal)" stroke="#3b4c78" stroke-width="1.5">
    <rect x="168" y="384" width="40" height="30" rx="13"/>
    <rect x="252" y="384" width="40" height="30" rx="13"/>
  </g>
  <g stroke="#0c1426" stroke-width="2">
    <line x1="181" y1="386" x2="181" y2="412"/>
    <line x1="194" y1="386" x2="194" y2="412"/>
    <line x1="266" y1="386" x2="266" y2="412"/>
    <line x1="279" y1="386" x2="279" y2="412"/>
  </g>
  <circle cx="188" cy="382" r="3" fill="#6f93ff"/>
  <circle cx="272" cy="382" r="3" fill="#6f93ff"/>
</svg>
